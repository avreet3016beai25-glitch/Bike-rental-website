<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Help Center & Rider Support | Rydo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="navbar.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script defer src="app.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #ec4899;
            --page-bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.96);
            --border-color: rgba(148, 163, 184, 0.25);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --navbar-bg: rgba(255, 255, 255, 0.94);
            --input-bg: rgba(255, 255, 255, 0.98);
        }
        body.theme-dark {
            --page-bg: #020617;
            --card-bg: rgba(15, 23, 42, 0.96);
            --border-color: rgba(148, 163, 184, 0.22);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --navbar-bg: rgba(2, 6, 23, 0.92);
            --input-bg: rgba(15, 23, 42, 0.98);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--page-bg); color: var(--text-main); line-height: 1.6; min-height: 100vh; transition: background 0.3s ease, color 0.3s ease; }

        /* --- NAVBAR STYLES --- */
        .navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 78px;
            padding: 12px 6%;
            background: var(--navbar-bg);
            backdrop-filter: blur(12px);
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
        }
        #navbar-root { display: contents; }
        .navbar-inner {
            width: 100%;
            max-width: 1440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 28px;
        }
        .logo {
            font-size: 25px;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.04em;
        }
        .logo-icon {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 13px;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            font-size: 17px;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 6px;
            align-items: center;
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.07);
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 650;
            padding: 9px 16px;
            border-radius: 999px;
            transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: var(--primary);
            background: var(--card-bg);
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
        }
        .navbar-actions { display: flex; gap: 10px; align-items: center; }
        .theme-switch-btn, .bookings-badge-btn, .nav-sos-quick-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: rgba(148, 163, 184, 0.08);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .nav-sos-quick-btn {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.35);
        }
        .nav-sos-quick-btn:hover { background: #ef4444; color: #fff; }
        .count-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            background: var(--primary);
            color: #ffffff;
        }
        .city-select {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 9px 12px;
            border-radius: 999px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            padding: 11px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35); }
        .btn-secondary {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            padding: 10px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-secondary:hover { background: var(--primary); color: #fff; }
        .menu-toggle { display: none; background: none; border: none; font-size: 20px; color: var(--text-main); cursor: pointer; }

        /* --- CONTACT PAGE CONTAINER --- */
        .contact-page-container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 130px 6% 80px;
        }
        .page-heading { text-align: center; margin-bottom: 36px; }
        .eyebrow {
            font-size: 12px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .page-heading h1 {
            font-size: clamp(32px, 4vw, 44px);
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 12px;
        }
        .page-heading p {
            font-size: 16px;
            color: var(--text-muted);
            max-width: 720px;
            margin: 0 auto;
        }

        /* --- CONTACT CHANNELS --- */
        .contact-channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 48px;
        }
        .contact-channel-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px 26px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
            transition: transform 0.2s;
        }
        .contact-channel-card:hover { transform: translateY(-4px); }
        .channel-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            display: grid;
            place-items: center;
            font-size: 22px;
            margin-bottom: 16px;
        }
        .contact-channel-card h3 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
        .contact-channel-card p { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 16px; flex: 1; }
        .channel-link {
            font-size: 14px;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .channel-link:hover { text-decoration: underline; }

        /* --- FAQS SECTION --- */
        .faqs-section { margin-bottom: 48px; }
        .section-header h3 { font-size: 24px; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
        .section-header p { font-size: 14px; color: var(--text-muted); }

        .faq-controls-row {
            display: flex;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin: 24px 0;
        }
        .faq-search-input-wrap {
            position: relative;
            flex: 1;
            min-width: 260px;
        }
        .faq-search-input-wrap i {
            position: absolute;
            left: 16px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }
        .faq-search-input-wrap input {
            width: 100%;
            height: 46px;
            padding: 0 16px 0 44px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }
        .faq-cat-pills { display: flex; gap: 8px; flex-wrap: wrap; }
        .category-pill {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .category-pill.is-active, .category-pill:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        /* --- FAQ ACCORDION --- */
        .faq-accordion-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .faq-accordion-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .faq-accordion-item.is-open { border-color: var(--primary); }
        .faq-question-btn {
            width: 100%;
            padding: 20px 24px;
            background: none;
            border: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            font-size: 15px;
            font-weight: 800;
            color: var(--text-main);
            cursor: pointer;
        }
        .faq-answer-body {
            padding: 0 24px 20px;
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.65;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
            padding-top: 14px;
        }

        /* --- TICKET DESK & RECENT TICKETS --- */
        .ticket-desk-section { margin-top: 48px; }
        .ticket-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 28px;
        }
        .ticket-form-card, .recent-tickets-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
        }
        .ticket-form-card h3, .recent-tickets-card h3 {
            font-size: 20px; font-weight: 800; margin-bottom: 4px;
            display: flex; align-items: center; gap: 8px;
        }
        .ticket-form-card p, .recent-tickets-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; }

        .modal-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        .modal-field label { font-size: 12px; font-weight: 700; color: var(--text-muted); }
        .modal-field input, .modal-field select, .review-textarea {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }
        .modal-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

        .tickets-list { display: flex; flex-direction: column; gap: 14px; }
        .ticket-item {
            padding: 16px;
            border-radius: 14px;
            background: rgba(148, 163, 184, 0.06);
            border: 1px solid var(--border-color);
        }
        .ticket-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .tkt-id { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800; color: var(--primary); }
        .tkt-status-badge {
            font-size: 10px; font-weight: 800; text-transform: uppercase;
            padding: 2px 8px; border-radius: 999px;
        }
        .tkt-status-badge.open { background: #fef08a; color: #854d0e; }
        .tkt-status-badge.resolved { background: #dcfce7; color: #166534; }
        .ticket-item h4 { font-size: 14px; font-weight: 800; margin-bottom: 2px; }
        .ticket-item p { font-size: 12px; color: var(--text-muted); margin: 0; }
        .no-tickets-box { text-align: center; padding: 40px 10px; color: var(--text-muted); }
        .no-tickets-box i { font-size: 36px; margin-bottom: 10px; }

        /* --- TOAST & MODAL SHARED STYLES --- */
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-pill { pointer-events: auto; display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 700; color: #fff; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); animation: toastSlideUp 0.3s ease; }
        .toast-success { background: linear-gradient(135deg, #059669, #10b981); }
        .toast-error { background: linear-gradient(135deg, #dc2626, #f87171); }
        @keyframes toastSlideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-backdrop { position: fixed; inset: 0; z-index: 10000; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 20px; overflow-y: auto; }
        .modal-dialog { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 20px; width: 100%; max-width: 600px; padding: 32px; position: relative; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35); }
        .modal-close-btn { position: absolute; top: 20px; right: 20px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-color); background: rgba(148, 163, 184, 0.1); color: var(--text-main); display: grid; place-items: center; cursor: pointer; }

        @media (max-width: 900px) {
            .ticket-grid { grid-template-columns: 1fr; }
            .modal-form-grid { grid-template-columns: 1fr; }
            .nav-links { display: none; }
            .nav-links.is-open { display: flex; flex-direction: column; position: absolute; top: 100%; left: 0; right: 0; background: var(--card-bg); border-radius: 0; padding: 20px; border-top: 1px solid var(--border-color); }
            .menu-toggle { display: block; }
            .navbar .theme-switch-btn .theme-label { display: none; }
        }
    </style>
</head>
<body>
    <div id="navbar-root"></div>
    <main>
        <div id="contact-root"></div>
    </main>
</body>
</html>
