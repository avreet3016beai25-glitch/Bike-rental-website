<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deals & Offers | Rydo Bike Rentals</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="navbar.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script defer src="app.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #ec4899;
            --page-bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.96);
            --border-color: rgba(148, 163, 184, 0.25);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --navbar-bg: rgba(255, 255, 255, 0.94);
            --input-bg: rgba(255, 255, 255, 0.98);
        }
        body.theme-dark {
            --page-bg: #020617;
            --card-bg: rgba(15, 23, 42, 0.96);
            --border-color: rgba(148, 163, 184, 0.22);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --navbar-bg: rgba(2, 6, 23, 0.92);
            --input-bg: rgba(15, 23, 42, 0.98);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--page-bg); color: var(--text-main); line-height: 1.6; min-height: 100vh; transition: background 0.3s ease, color 0.3s ease; }

        /* --- NAVBAR STYLES --- */
        .navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 78px;
            padding: 12px 6%;
            background: var(--navbar-bg);
            backdrop-filter: blur(12px);
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
        }
        #navbar-root { display: contents; }
        .navbar-inner {
            width: 100%;
            max-width: 1440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 28px;
        }
        .logo {
            font-size: 25px;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.04em;
        }
        .logo-icon {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 13px;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            font-size: 17px;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 6px;
            align-items: center;
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.07);
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 650;
            padding: 9px 16px;
            border-radius: 999px;
            transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #ffffff;
            background: var(--primary);
        }
        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .theme-switch-btn, .bookings-badge-btn, .nav-sos-quick-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: rgba(148, 163, 184, 0.08);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .nav-sos-quick-btn {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.35);
        }
        .nav-sos-quick-btn:hover { background: #ef4444; color: #fff; }
        .theme-switch-btn:hover, .bookings-badge-btn:hover {
            background: rgba(37, 99, 235, 0.12);
            border-color: rgba(37, 99, 235, 0.35);
        }
        .count-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            background: var(--primary);
            color: #ffffff;
        }
        .city-select {
            padding: 9px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }
        .user-profile-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.25);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 700;
        }
        .user-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 800;
        }
        .signout-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 4px;
            font-size: 13px;
        }
        .signout-btn:hover { color: #ef4444; }
        .nav-signin-btn, .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 20px;
            cursor: pointer;
        }

        /* --- DEALS PAGE CONTENT --- */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 140px 6% 80px;
        }
        .page-heading { max-width: 700px; margin-bottom: 28px; }
        .eyebrow { color: var(--primary); font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
        h1 { margin: 8px 0 12px; font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: 1.1; font-weight: 800; }
        .page-heading p { color: var(--text-muted); font-size: 16px; }

        .category-pills {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 16px;
            margin-bottom: 30px;
            scrollbar-width: none;
        }
        .category-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .category-pill:hover {
            border-color: rgba(37, 99, 235, 0.4);
            color: var(--text-main);
        }
        .category-pill.is-active {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.28);
        }

        .deal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }
        .deal-card {
            min-height: 270px;
            padding: 32px;
            border-radius: 20px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 18px 40px rgba(15, 23, 42, .14);
            transition: transform 0.25s, box-shadow 0.25s;
        }
        .deal-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 24px 50px rgba(15, 23, 42, .22);
        }
        .deal-icon { font-size: 32px; margin-bottom: 18px; }
        .deal-card h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
        .deal-card p { color: rgba(255, 255, 255, .9); font-size: 14px; line-height: 1.6; }
        .deal-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            width: 100%;
            margin-top: 28px;
            flex-wrap: wrap;
        }
        .coupon-copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: 1px dashed rgba(255, 255, 255, .8);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s;
        }
        .coupon-copy-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: #fff;
        }
        .claim {
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .claim:hover { text-decoration: underline; }

        /* --- TOAST & MODAL SHARED STYLES --- */
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-pill { pointer-events: auto; display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 700; color: #fff; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); animation: toastSlideUp 0.3s ease; }
        .toast-success { background: linear-gradient(135deg, #059669, #10b981); }
        .toast-error { background: linear-gradient(135deg, #dc2626, #f87171); }
        @keyframes toastSlideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-backdrop { position: fixed; inset: 0; z-index: 10000; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 20px; overflow-y: auto; }
        .modal-dialog { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 20px; width: 100%; max-width: 600px; padding: 32px; position: relative; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35); }
        .modal-close-btn { position: absolute; top: 20px; right: 20px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-color); background: rgba(148, 163, 184, 0.1); color: var(--text-main); display: grid; place-items: center; cursor: pointer; }
        .modal-header h2 { font-size: 24px; margin-bottom: 4px; }
        .modal-header p { color: var(--text-muted); font-size: 13px; }
        .modal-badge { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: var(--primary); margin-bottom: 6px; }
        .bookings-list { display: flex; flex-direction: column; gap: 14px; max-height: 400px; overflow-y: auto; }
        .booking-item-card { display: flex; align-items: center; gap: 16px; padding: 14px; border-radius: 12px; border: 1px solid var(--border-color); background: rgba(148, 163, 184, 0.05); }
        .booking-item-thumb { width: 75px; height: 55px; object-fit: cover; border-radius: 8px; }
        .booking-item-info { flex: 1; }
        .booking-id-tag { display: flex; gap: 8px; align-items: center; font-size: 11px; font-weight: 800; margin-bottom: 2px; }
        .city-tag { background: rgba(37, 99, 235, 0.12); color: var(--primary); padding: 2px 6px; border-radius: 4px; }
        .booking-item-info h3 { font-size: 15px; margin-bottom: 3px; }
        .booking-item-info p { font-size: 12px; color: var(--text-muted); }
        .booking-total-row { font-size: 12px; margin-top: 4px; }
        .booking-total-row strong { color: var(--primary); font-size: 13px; }
        .cancel-booking-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 16px; padding: 8px; border-radius: 8px; }
        .bookings-empty-state { text-align: center; padding: 40px 10px; }
        .bookings-empty-state i { font-size: 44px; color: var(--text-muted); margin-bottom: 12px; }

        @media (max-width: 820px) {
            .nav-links { display: none; }
            .nav-links.is-open { display: flex; flex-direction: column; position: absolute; top: 100%; left: 0; right: 0; background: var(--card-bg); border-radius: 0; padding: 20px; border-top: 1px solid var(--border-color); }
            .menu-toggle { display: block; }
            .navbar .theme-switch-btn .theme-label { display: none; }
        }
    </style>
</head>
<body>
    <div id="navbar-root"></div>
    <main>
        <div id="deals-root"></div>
    </main>
</body>
</html>
