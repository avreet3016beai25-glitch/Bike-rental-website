<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Rydo | Live Bike Wallpaper</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #ec4899;
            --cyan: #06b6d4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            color: #ffffff;
        }

        /* --- LIVE BIKE WALLPAPER BACKGROUND --- */
        .video-wallpaper-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 1;
        }

        .live-bike-wallpaper {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.55) contrast(1.1);
            transform: scale(1.02);
            animation: subtleZoom 15s infinite alternate ease-in-out;
        }

        @keyframes subtleZoom {
            from { transform: scale(1); }
            to { transform: scale(1.06); }
        }

        /* Vignette overlay to keep wallpaper visible while highlighting center spinner */
        .wallpaper-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.4) 0%, rgba(2, 6, 23, 0.88) 85%);
            pointer-events: none;
        }

        /* --- CENTER LOADING CONTAINER --- */
        .loading-screen-wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .loading-box {
            width: 100%;
            max-width: 440px;
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 28px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.65), 0 0 40px rgba(37, 99, 235, 0.25);
            animation: boxFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        @keyframes boxFadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Brand Emblem */
        .brand-header {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .brand-icon-badge {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 20px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }

        .brand-title {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #ffffff 40%, #bfdbfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- THE SPINNER LOADING --- */
        .spinner-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 24px;
            display: grid;
            place-items: center;
        }

        .spinner-outer-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--primary);
            border-right: 4px solid var(--secondary);
            animation: spinRing 1s cubic-bezier(0.5, 0.15, 0.4, 0.85) infinite;
            filter: drop-shadow(0 0 14px rgba(37, 99, 235, 0.8));
        }

        .spinner-inner-ring {
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-bottom: 3px solid var(--cyan);
            border-left: 3px solid var(--primary);
            animation: spinRingReverse 1.5s linear infinite;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinRingReverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        .spinner-bike-icon {
            font-size: 26px;
            color: #ffffff;
            animation: pulseBike 1.6s ease-in-out infinite;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
        }

        @keyframes pulseBike {
            0%, 100% { transform: scale(0.9); opacity: 0.85; }
            50% { transform: scale(1.18); opacity: 1; filter: drop-shadow(0 0 14px var(--cyan)); }
        }

        /* Percentage Counter */
        .progress-percentage {
            font-family: 'JetBrains Mono', monospace;
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        /* Telemetry Status Message */
        .loading-status-text {
            font-size: 13px;
            font-weight: 700;
            color: #93c5fd;
            min-height: 22px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Progress Bar Track */
        .progress-track {
            width: 100%;
            height: 7px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 26px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--primary), var(--cyan) 60%, var(--secondary) 100%);
            box-shadow: 0 0 14px rgba(37, 99, 235, 0.7);
            transition: width 0.1s linear;
        }

        /* Action Buttons */
        .loading-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-open-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-open-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.45);
        }

        .btn-open-login {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 12px 18px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #e2e8f0;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .btn-open-login:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
        }

        /* Exit Transition */
        .is-redirecting {
            animation: exitFade 0.45s forwards ease-in-out;
        }

        @keyframes exitFade {
            to { opacity: 0; transform: scale(0.96) translateY(-15px); filter: blur(8px); }
        }
    </style>
</head>
<body>
    <!-- 1. LIVE BIKE WALLPAPER BACKGROUND VIDEO -->
    <div class="video-wallpaper-container">
        <video id="wallpaperVideo" class="live-bike-wallpaper" autoplay muted loop playsinline poster="bike.jpeg">
            <source src="realistic_motorbike_in_mountai.mp4" type="video/mp4">
        </video>
        <div class="wallpaper-overlay"></div>
    </div>

    <!-- 2. CENTER SPINNER LOADING SCREEN -->
    <div class="loading-screen-wrap">
        <div class="loading-box" id="loadingCard">
            <!-- Brand -->
            <div class="brand-header">
                <div class="brand-icon-badge">
                    <i class="fa-solid fa-motorcycle"></i>
                </div>
                <div class="brand-title">Rydo</div>
            </div>

            <!-- SPINNER LOADER (LIKE BEFORE) -->
            <div class="spinner-container">
                <div class="spinner-outer-ring"></div>
                <div class="spinner-inner-ring"></div>
                <div class="spinner-bike-icon">
                    <i class="fa-solid fa-motorcycle"></i>
                </div>
            </div>

            <!-- Percentage Counter -->
            <div class="progress-percentage" id="percentText">0%</div>

            <!-- Telemetry Status Message -->
            <div class="loading-status-text" id="statusText">Igniting Rydo engine...</div>

            <!-- Progress Bar -->
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <!-- Skip / Direct Open Buttons -->
            <div class="loading-actions">
                <a href="home.html" class="btn-open-home" id="launchBtn">
                    Open Home Page <i class="fa-solid fa-arrow-right"></i>
                </a>
                <a href="login.html" class="btn-open-login">
                    <i class="fa-solid fa-user-lock"></i> Sign In
                </a>
            </div>
        </div>
    </div>

    <!-- 3. PROGRESS LOGIC & AUTO-OPEN HOME PAGE -->
    <script>
        // Safeguard video playback across browsers
        const video = document.getElementById('wallpaperVideo');
        if (video) {
            video.muted = true;
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(e => {
                    console.log('Video autoplay prevented by policy, poster visible:', e);
                });
            }
        }

        const statusSteps = [
            "Igniting Rydo engine...",
            "Connecting Pan-India telemetry...",
            "Loading verified bike fleet...",
            "Checking zero-deposit availability...",
            "Calibrating GPS hubs...",
            "Ready to ride! Opening Home Page..."
        ];

        let progress = 0;
        const percentText = document.getElementById('percentText');
        const statusText = document.getElementById('statusText');
        const progressFill = document.getElementById('progressFill');
        const loadingCard = document.getElementById('loadingCard');

        const interval = setInterval(() => {
            // Smooth natural increments
            progress += Math.floor(Math.random() * 4) + 2;

            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
                percentText.textContent = '100%';
                progressFill.style.width = '100%';
                statusText.innerHTML = '<i class="fa-solid fa-check" style="color: #22c55e;"></i> Ready! Opening Rydo Home...';

                setTimeout(() => {
                    loadingCard.classList.add('is-redirecting');
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 400);
                }, 500);
            } else {
                percentText.textContent = `${progress}%`;
                progressFill.style.width = `${progress}%`;

                const stepIndex = Math.min(
                    Math.floor((progress / 100) * statusSteps.length),
                    statusSteps.length - 1
                );
                statusText.textContent = statusSteps[stepIndex];
            }
        }, 60);
    </script>
</body>
</html>
