<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3;url=home.html">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: #090f19;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .video-background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 1;
            background: rgba(0, 0, 0, 0.4);
        }

        body > *:not(.video-background) {
            position: relative;
            z-index: 2;
        }

        .site-name {
            font-size: 3.0rem;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            color:rgb(164, 161, 156);
            font-family: italic;
        }
        .spinner{
            width: 200px;
            height: 200px;
            border: 10px solid rgba(255,255,255,0.4);
            border-top: 10px solid white;
            border-radius: 50%;
            animation: spin 2s linear infinite;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        @keyframes spin{
            0%{transform:rotate(0deg);}
            25%{transform:rotate(90deg);}
            50%{transform:rotate(180deg);}
            75%{transform:rotate(270deg);}
            100%{transform:rotate(360deg);}
        }
    </style>
</head>
<body>
    <video class="video-background" autoplay muted loop playsinline poster="bike.jpeg" aria-hidden="true">
        <source src="57844-486852650.mp4" type="video/mp4">
    </video>
    <div class="site-name">RYDO</div>
    <div class="spinner"></div>        
</body>
</html>
