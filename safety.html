<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Safety, Insurance & 24/7 Roadside SOS | Rydo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="navbar.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script defer src="app.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #ec4899;
            --page-bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.96);
            --border-color: rgba(148, 163, 184, 0.25);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --navbar-bg: rgba(255, 255, 255, 0.94);
            --input-bg: rgba(255, 255, 255, 0.98);
        }
        body.theme-dark {
            --page-bg: #020617;
            --card-bg: rgba(15, 23, 42, 0.96);
            --border-color: rgba(148, 163, 184, 0.22);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --navbar-bg: rgba(2, 6, 23, 0.92);
            --input-bg: rgba(15, 23, 42, 0.98);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--page-bg); color: var(--text-main); line-height: 1.6; min-height: 100vh; transition: background 0.3s ease, color 0.3s ease; }

        /* --- NAVBAR STYLES --- */
        .navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 78px;
            padding: 12px 6%;
            background: var(--navbar-bg);
            backdrop-filter: blur(12px);
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
        }
        #navbar-root { display: contents; }
        .navbar-inner {
            width: 100%;
            max-width: 1440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 28px;
        }
        .logo {
            font-size: 25px;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.04em;
        }
        .logo-icon {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 13px;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            font-size: 17px;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 6px;
            align-items: center;
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.07);
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 650;
            padding: 9px 16px;
            border-radius: 999px;
            transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: var(--primary);
            background: var(--card-bg);
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
        }
        .navbar-actions { display: flex; gap: 10px; align-items: center; }
        .theme-switch-btn, .bookings-badge-btn, .nav-sos-quick-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: rgba(148, 163, 184, 0.08);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .nav-sos-quick-btn {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.35);
        }
        .nav-sos-quick-btn:hover { background: #ef4444; color: #fff; }
        .count-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            background: var(--primary);
            color: #ffffff;
        }
        .city-select {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 9px 12px;
            border-radius: 999px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            padding: 11px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35); }
        .btn-secondary {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            padding: 10px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-secondary:hover { background: var(--primary); color: #fff; }
        .menu-toggle { display: none; background: none; border: none; font-size: 20px; color: var(--text-main); cursor: pointer; }

        /* --- SAFETY PAGE CONTAINER --- */
        .safety-page-container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 130px 6% 80px;
        }
        .page-heading { text-align: center; margin-bottom: 36px; }
        .eyebrow {
            font-size: 12px;
            font-weight: 800;
            color: #10b981;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .page-heading h1 {
            font-size: clamp(32px, 4vw, 44px);
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 12px;
        }
        .page-heading p {
            font-size: 16px;
            color: var(--text-muted);
            max-width: 720px;
            margin: 0 auto;
        }

        /* --- 3 CORE PILLARS --- */
        .safety-pillars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 48px;
        }
        .safety-pillar-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
            transition: transform 0.2s;
        }
        .safety-pillar-card:hover { transform: translateY(-4px); }
        .pillar-icon {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
            display: grid;
            place-items: center;
            font-size: 22px;
            margin-bottom: 18px;
        }
        .safety-pillar-card h3 { font-size: 19px; font-weight: 800; margin-bottom: 8px; }
        .safety-pillar-card p { font-size: 14px; color: var(--text-muted); line-height: 1.6; }

        /* --- SOS RADAR CONSOLE --- */
        .sos-radar-section { margin-bottom: 48px; }
        .sos-radar-console {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
            transition: all 0.3s ease;
        }
        .sos-radar-console.is-active {
            border-color: #ef4444;
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.25);
        }
        .sos-console-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }
        .sos-alert-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.12em;
            color: #ef4444;
            margin-bottom: 6px;
        }
        .sos-console-header h2 { font-size: 26px; font-weight: 800; margin-bottom: 4px; }
        .sos-console-header p { font-size: 14px; color: var(--text-muted); }
        .btn-trigger-sos {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 14px;
            background: linear-gradient(135deg, #dc2626, #ef4444);
            color: #fff;
            border: none;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-trigger-sos:hover { transform: scale(1.02); box-shadow: 0 12px 30px rgba(239, 68, 68, 0.5); }
        .btn-cancel-sos {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 12px;
            background: rgba(148, 163, 184, 0.12);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        /* --- ACTIVE SOS PANEL & RADAR ANIMATION --- */
        .sos-active-panel {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 28px;
            align-items: center;
            padding: 24px;
            background: rgba(239, 68, 68, 0.05);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 18px;
        }
        .sos-radar-animation-box {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(15, 23, 42, 0.04);
        }
        body.theme-dark .sos-radar-animation-box { background: rgba(0, 0, 0, 0.5); }
        .radar-circle {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(239, 68, 68, 0.4);
            animation: radarPulse 2.5s infinite linear;
        }
        .circle-1 { width: 60px; height: 60px; animation-delay: 0s; }
        .circle-2 { width: 120px; height: 120px; animation-delay: 0.8s; }
        .circle-3 { width: 180px; height: 180px; animation-delay: 1.6s; }
        @keyframes radarPulse {
            0% { transform: scale(0.6); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 0; }
        }
        .radar-center-bike {
            position: relative;
            z-index: 2;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #ef4444;
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 18px;
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.8);
        }
        .radar-blip-tow {
            position: absolute;
            top: 25px; right: 35px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #10b981;
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 13px;
            animation: blipGlow 1.2s infinite alternate;
        }
        @keyframes blipGlow {
            from { transform: scale(0.9); opacity: 0.7; }
            to { transform: scale(1.15); opacity: 1; box-shadow: 0 0 12px #10b981; }
        }

        .dispatch-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .beacon-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #ef4444;
            animation: blinkBeacon 0.8s infinite alternate;
        }
        @keyframes blinkBeacon { from { opacity: 0.3; } to { opacity: 1; } }
        .sos-details-card h3 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
        .sos-details-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
        .sos-coords-strip {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(148, 163, 184, 0.1);
            margin-bottom: 16px;
        }
        .sos-panel-actions { display: flex; gap: 12px; flex-wrap: wrap; }

        .sos-idle-telemetry {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        .idle-item {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .idle-item i { font-size: 24px; color: var(--primary); }
        .idle-item strong { display: block; font-size: 13px; }
        .idle-item p { font-size: 12px; color: var(--text-muted); margin: 0; }

        /* --- PRE-RIDE CHECKLIST --- */
        .pre-ride-checklist-section { margin-bottom: 48px; }
        .checklist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }
        .checklist-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }
        .checklist-card-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            display: grid;
            place-items: center;
            font-size: 18px;
            margin-bottom: 14px;
        }
        .checklist-card h4 { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
        .checklist-card p { font-size: 13px; color: var(--text-muted); line-height: 1.5; }

        /* --- EMERGENCY HOTLINES --- */
        .emergency-hotlines-box {
            background: rgba(148, 163, 184, 0.06);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
        }
        .emergency-hotlines-box h3 { font-size: 20px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .hotlines-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }
        .hotline-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
        }
        .hotline-label { font-size: 12px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 4px; }
        .hotline-number { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 900; color: #ef4444; text-decoration: none; display: block; margin-bottom: 4px; }
        .hotline-card p { font-size: 12px; color: var(--text-muted); margin: 0; }

        /* --- TOAST & MODAL SHARED STYLES --- */
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-pill { pointer-events: auto; display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 700; color: #fff; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); animation: toastSlideUp 0.3s ease; }
        .toast-success { background: linear-gradient(135deg, #059669, #10b981); }
        .toast-error { background: linear-gradient(135deg, #dc2626, #f87171); }
        @keyframes toastSlideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-backdrop { position: fixed; inset: 0; z-index: 10000; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 20px; overflow-y: auto; }
        .modal-dialog { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 20px; width: 100%; max-width: 600px; padding: 32px; position: relative; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35); }
        .modal-close-btn { position: absolute; top: 20px; right: 20px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-color); background: rgba(148, 163, 184, 0.1); color: var(--text-main); display: grid; place-items: center; cursor: pointer; }

        @media (max-width: 820px) {
            .sos-active-panel { grid-template-columns: 1fr; }
            .nav-links { display: none; }
            .nav-links.is-open { display: flex; flex-direction: column; position: absolute; top: 100%; left: 0; right: 0; background: var(--card-bg); border-radius: 0; padding: 20px; border-top: 1px solid var(--border-color); }
            .menu-toggle { display: block; }
            .navbar .theme-switch-btn .theme-label { display: none; }
        }
    </style>
</head>
<body>
    <div id="navbar-root"></div>
    <main>
        <div id="safety-root"></div>
    </main>
</body>
</html>
