<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rydo Miles Loyalty Club & Biker Rewards | Rydo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="navbar.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script defer src="app.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #ec4899;
            --page-bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.96);
            --border-color: rgba(148, 163, 184, 0.25);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --navbar-bg: rgba(255, 255, 255, 0.94);
            --input-bg: rgba(255, 255, 255, 0.98);
        }
        body.theme-dark {
            --page-bg: #020617;
            --card-bg: rgba(15, 23, 42, 0.96);
            --border-color: rgba(148, 163, 184, 0.22);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --navbar-bg: rgba(2, 6, 23, 0.92);
            --input-bg: rgba(15, 23, 42, 0.98);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--page-bg); color: var(--text-main); line-height: 1.6; min-height: 100vh; transition: background 0.3s ease, color 0.3s ease; }

        /* --- NAVBAR STYLES --- */
        .navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 78px;
            padding: 12px 6%;
            background: var(--navbar-bg);
            backdrop-filter: blur(12px);
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
        }
        #navbar-root { display: contents; }
        .navbar-inner {
            width: 100%;
            max-width: 1440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 28px;
        }
        .logo {
            font-size: 25px;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.04em;
        }
        .logo-icon {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 13px;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            font-size: 17px;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 6px;
            align-items: center;
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.07);
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 650;
            padding: 9px 16px;
            border-radius: 999px;
            transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: var(--primary);
            background: var(--card-bg);
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
        }
        .navbar-actions { display: flex; gap: 10px; align-items: center; }
        .theme-switch-btn, .bookings-badge-btn, .nav-sos-quick-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: rgba(148, 163, 184, 0.08);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .nav-sos-quick-btn {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.35);
        }
        .nav-sos-quick-btn:hover { background: #ef4444; color: #fff; }
        .count-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            background: var(--primary);
            color: #ffffff;
        }
        .city-select {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 9px 12px;
            border-radius: 999px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            padding: 11px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35); }
        .btn-secondary {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            padding: 10px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-secondary:hover { background: var(--primary); color: #fff; }
        .menu-toggle { display: none; background: none; border: none; font-size: 20px; color: var(--text-main); cursor: pointer; }

        /* --- LOYALTY PAGE CONTAINER --- */
        .loyalty-page-container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 130px 6% 80px;
        }
        .page-heading { text-align: center; margin-bottom: 36px; }
        .eyebrow {
            font-size: 12px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .page-heading h1 {
            font-size: clamp(32px, 4vw, 44px);
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 12px;
        }
        .page-heading p {
            font-size: 16px;
            color: var(--text-muted);
            max-width: 720px;
            margin: 0 auto;
        }

        /* --- STATUS CARD & PROGRESS --- */
        .loyalty-status-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
            margin-bottom: 36px;
        }
        .loyalty-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 28px;
        }
        .tier-badge-group {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .tier-emblem {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            border: 3px solid;
            background: rgba(148, 163, 184, 0.08);
            display: grid;
            place-items: center;
            font-size: 30px;
        }
        .current-tier-label {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.1em;
            color: var(--primary);
            text-transform: uppercase;
        }
        .tier-name-title {
            font-size: 28px;
            font-weight: 800;
            margin: 2px 0 6px;
        }
        .tier-perk-text { font-size: 13px; color: var(--text-muted); }
        .xp-score-box {
            text-align: right;
            padding: 16px 24px;
            border-radius: 16px;
            background: rgba(37, 99, 235, 0.06);
            border: 1px solid rgba(37, 99, 235, 0.2);
        }
        .xp-score-box span { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .xp-digits {
            font-family: 'JetBrains Mono', monospace;
            font-size: 36px;
            font-weight: 900;
            color: var(--primary);
            line-height: 1.1;
            margin: 4px 0;
        }
        .xp-digits small { font-size: 16px; }
        .kms-counter { font-size: 13px !important; color: var(--text-main) !important; font-weight: 700 !important; }

        .tier-progress-track-wrap { margin-top: 10px; }
        .progress-labels-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .tier-bar-bg {
            width: 100%;
            height: 10px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.16);
            overflow: hidden;
        }
        .tier-bar-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 0.4s ease;
        }

        /* --- TIERS COMPARISON GRID --- */
        .tiers-comparison-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 48px;
        }
        .tier-card-col {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 26px;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }
        .tier-card-col:hover { transform: translateY(-4px); }
        .tier-card-col.is-current-tier {
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.18);
        }
        .tier-col-icon { font-size: 26px; margin-bottom: 12px; }
        .tier-card-col h4 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
        .tier-xp-range { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 12px; }
        .tier-card-col p { font-size: 13px; color: var(--text-muted); line-height: 1.5; flex: 1; }
        .active-tier-tag {
            display: inline-block;
            margin-top: 14px;
            padding: 4px 10px;
            border-radius: 6px;
            background: var(--primary);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            text-align: center;
        }

        /* --- BADGES GRID --- */
        .badges-section { margin-bottom: 48px; }
        .section-header h3 { font-size: 24px; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
        .section-header p { font-size: 14px; color: var(--text-muted); }
        .badges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }
        .badge-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .badge-card.is-unlocked { border-color: rgba(16, 185, 129, 0.4); }
        .badge-card.is-locked { opacity: 0.65; }
        .badge-icon-wrap {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            display: grid;
            place-items: center;
            font-size: 20px;
            margin-bottom: 14px;
        }
        .badge-card.is-unlocked .badge-icon-wrap { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .badge-card h4 { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
        .badge-card p { font-size: 13px; color: var(--text-muted); flex: 1; margin-bottom: 14px; }
        .badge-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 800;
        }
        .badge-status-pill.unlocked { color: #10b981; }
        .badge-status-pill.locked { color: var(--text-muted); }

        /* --- VOUCHERS GRID --- */
        .vouchers-section { margin-bottom: 48px; }
        .vouchers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }
        .reward-voucher-card {
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            border-radius: 18px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .voucher-cost-tag {
            position: absolute;
            top: 20px; right: 20px;
            font-family: 'JetBrains Mono', monospace;
            padding: 4px 10px;
            border-radius: 8px;
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            font-size: 12px;
            font-weight: 800;
        }
        .reward-voucher-card h4 { font-size: 17px; font-weight: 800; margin-bottom: 8px; padding-right: 60px; }
        .reward-voucher-card p { font-size: 13px; color: var(--text-muted); flex: 1; margin-bottom: 18px; }
        .claim-voucher-btn { font-size: 13px; padding: 10px 18px; text-align: center; }
        .claim-voucher-btn.is-claimed { background: rgba(16, 185, 129, 0.2); color: #10b981; box-shadow: none; cursor: default; }

        /* --- REFERRAL BOX --- */
        .referral-box-card {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.12), rgba(236, 72, 153, 0.1));
            border: 1px solid rgba(37, 99, 235, 0.3);
            border-radius: 24px;
            padding: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            flex-wrap: wrap;
        }
        .referral-icon-badge {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--primary);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 24px;
        }
        .referral-copy { flex: 1; min-width: 260px; }
        .referral-copy h3 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
        .referral-copy p { font-size: 14px; color: var(--text-muted); }
        .copy-referral-btn { font-size: 14px; padding: 12px 24px; }

        /* --- TOAST & MODAL SHARED STYLES --- */
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-pill { pointer-events: auto; display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 700; color: #fff; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); animation: toastSlideUp 0.3s ease; }
        .toast-success { background: linear-gradient(135deg, #059669, #10b981); }
        .toast-error { background: linear-gradient(135deg, #dc2626, #f87171); }
        @keyframes toastSlideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-backdrop { position: fixed; inset: 0; z-index: 10000; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 20px; overflow-y: auto; }
        .modal-dialog { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 20px; width: 100%; max-width: 600px; padding: 32px; position: relative; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35); }
        .modal-close-btn { position: absolute; top: 20px; right: 20px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-color); background: rgba(148, 163, 184, 0.1); color: var(--text-main); display: grid; place-items: center; cursor: pointer; }

        @media (max-width: 820px) {
            .nav-links { display: none; }
            .nav-links.is-open { display: flex; flex-direction: column; position: absolute; top: 100%; left: 0; right: 0; background: var(--card-bg); border-radius: 0; padding: 20px; border-top: 1px solid var(--border-color); }
            .menu-toggle { display: block; }
            .navbar .theme-switch-btn .theme-label { display: none; }
        }
    </style>
</head>
<body>
    <div id="navbar-root"></div>
    <main>
        <div id="loyalty-root"></div>
    </main>
</body>
</html>
